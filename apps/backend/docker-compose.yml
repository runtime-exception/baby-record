# 宝宝成长记录服务 · docker-compose
#
# 模式 A（内置 PostgreSQL）：
#   cp .env.example .env
#   设置 DATABASE_PASSWORD 并清空 DATABASE_URL 后运行 docker compose up -d --build
#   应用启动时执行 Prisma 迁移，连接内置 PostgreSQL。
#
# 模式 B（连接外部 PostgreSQL）：
#   注释掉 postgres 服务与 depends_on，并将 app.environment 中的数据库连接改为外部地址，
#   或改用 env_file: .env（需先 cp .env.example .env 并填写）。

services:
  postgres:
    image: postgres:15-alpine
    container_name: baby-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-baby_record}
      POSTGRES_USER: ${DATABASE_USERNAME:-baby_record}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - baby-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-baby_record} -d ${DATABASE_NAME:-baby_record}"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    container_name: baby-record
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - APP_PORT=3000
      - API_PREFIX=api/v1
      - SWAGGER_PATH=docs
      - WECHAT_APP_ID=${WECHAT_APP_ID:-}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET:-}
      - WECHAT_ENV_VERSION=${WECHAT_ENV_VERSION:-release}
      - BABY_RECORD_SESSION_DAYS=${BABY_RECORD_SESSION_DAYS:-30}
      - BABY_RECORD_COOKIE_SECURE=${BABY_RECORD_COOKIE_SECURE:-false}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DATABASE_NAME:-baby_record}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-baby_record}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      - DATABASE_URL=${DATABASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  baby-pgdata:

packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': set this to true or false
  '@prisma/engines': set this to true or false
  '@scarf/scarf': set this to true or false
  esbuild: set this to true or false
  prisma: set this to true or false
  vue-demi: set this to true or false

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
  - esbuild
  - vue-demi
  - '@scarf/scarf'

strictDepBuilds: false

overrides:
  'express>body-parser': ^2.4.0
  'express>proxy-addr': ^2.0.8
  'express>qs': ^6.16.1
  'body-parser>qs': ^6.16.1
  '@nestjs/platform-express>multer': ^2.5.0
  '@nestjs/swagger>js-yaml': ^5.4.1
  'axios>follow-redirects': ^1.16.2
  'postcss>nanoid': ^3.3.18
  '@vue/compiler-core>source-map-js': ^1.2.2
